[package]
name = "veruszsupport"
version = "1.0.0"
edition = "2021"
rust-version = "1.77"
description = "Web (WebAssembly) boundary of veruszsupport, made with wasm-bindgen"

[lib]
# cdylib: the .wasm that wasm-pack builds.
# rlib: lets veruszsupporttests call the exports.
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
secrecy = "0.8.0"
veruszsupportcore = { path = "../veruszsupportcore" }
wasm-bindgen = "0.2.100"

# Same forks as veruszsupportcore. Cargo only reads [patch] from the crate
# being built, so each crate repeats it.
[patch.crates-io]
sapling-crypto = { git = "https://github.com/who-biz/sapling-crypto", branch = "ka_agree" }
zcash_note_encryption = { git = "https://github.com/who-biz/zcash_note_encryption", branch = "ka_agree" }
orchard = { git = "https://github.com/who-biz/orchard", branch = "ka_agree" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
